<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b14" />
  <title>Vertragsmanager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">VM</div>
        <div>
          <div class="brand-title">Vertragsmanager</div>
          <div class="brand-subtitle">Version 2 · Dark</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard"><span>◈</span> Dashboard</button>
        <button class="nav-item" data-view="providers"><span>▦</span> Dienstleister</button>
        <button class="nav-item" data-view="contracts"><span>▤</span> Verträge</button>
        <button class="nav-item" data-view="cancellations"><span>✓</span> Kündigungen</button>
        <button class="nav-item" data-view="categories"><span>◇</span> Kategorien</button>
        <button class="nav-item" data-view="users"><span>◎</span> Benutzer</button>
        <button class="nav-item" data-view="settings"><span>⚙</span> Daten & Export</button>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-note">
          <strong>Lokaler Modus</strong>
          <span>Keine Firebase-Verbindung · Dashwise vorbereitet</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menü">☰</button>
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle">Verträge, Fristen und Kündigungen im Blick</p>
        </div>
        <div class="topbar-actions">
          <div class="user-switcher">
            <span class="muted">Aktiver Benutzer</span>
            <select id="currentUserSelect"></select>
          </div>
          <button class="primary-btn" id="quickAddContractBtn">+ Vertrag</button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
