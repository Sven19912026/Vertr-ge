<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071019" />
  <title>Supplier Hub V4</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">SH</div>
        <div>
          <div class="brand-title">Supplier Hub</div>
          <div class="brand-subtitle">Vertraege & Einkauf</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">&#9672;</span> Dashboard</button>
        <div class="nav-section">Einkauf</div>
        <button class="nav-item" data-view="suppliers"><span class="nav-icon">&#9638;</span> Lieferanten</button>
        <button class="nav-item" data-view="negotiations"><span class="nav-icon">&#8644;</span> Verhandlungen</button>
        <button class="nav-item" data-view="contracts"><span class="nav-icon">&#9636;</span> Vertraege</button>
        <button class="nav-item" data-view="cancellations"><span class="nav-icon">&#10003;</span> Kuendigungen</button>
        <div class="nav-section">Verwaltung</div>
        <button class="nav-item" data-view="categories"><span class="nav-icon">&#9671;</span> Kategorien</button>
        <button class="nav-item" data-view="users"><span class="nav-icon">&#9678;</span> Benutzer</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">&#9881;</span> Daten & Export</button>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-note">
          <strong>Lokaler Modus</strong>
          <span>IndexedDB lokal. Dashwise-Cloud vorbereitet.</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menue">&#9776;</button>
        <div class="topbar-title">
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle">Lieferanten, Verhandlungen und Vertraege im Blick</p>
        </div>
        <div class="topbar-actions">
          <div class="user-switcher">
            <span>Aktiver Benutzer</span>
            <select id="currentUserSelect"></select>
          </div>
          <button class="primary-btn" id="quickAddBtn">+ Neu</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
